services:
  monitoring_drupal.stopwatch:
    class: Symfony\Component\Stopwatch\Stopwatch
    arguments: []
  monitoring_drupal.basic:
    class: Drupal\monitoring_drupal\Services\BasicMonitoring
    arguments: []
  monitoring_drupal.timer:
    class: Drupal\monitoring_drupal\Services\TimerMonitoring
    arguments: []

  monitoring_drupal.profiler:
    class: Drupal\monitoring_drupal\Profiler\Profiler
    arguments: ['@service_container', '@event_dispatcher']
  
#  monitoring_drupal.data_collectors:
#    class: Drupal\Core\DependencyInjection\Container
#    factory: ['@monitoring_drupal.profiler_service_provider', 'getDataCollectors']
  
  monitoring_drupal.profiler_service_provider:
    class: Drupal\monitoring_drupal\Profiler\ProfilerServiceProvider
    arguments: ['@service_container']
 
  monitoring_drupal.subscriber:
    class: Drupal\monitoring_drupal\EventSubscriber\MonitoringDrupalSubscriber
    arguments: 
      - '@messenger'
      - '@monitoring_drupal.profiler'
      - '@monitoring_drupal.stopwatch'
      - '@renderer'
    tags:
      - { name: event_subscriber }
  
  monitoring_drupal.data_collector.database:
    class: Drupal\monitoring_drupal\Profiler\DataCollector\DatabaseDataCollector
    arguments: ['@database']
    tags:
      - { name: data_collector, id: cache }
  
  monitoring_drupal.data_collector.memory:
    class: Drupal\monitoring_drupal\Profiler\DataCollector\MemoryDataCollector
    tags:
      - { name: data_collector, id: memory }
  
  monitoring_drupal.data_collector.time:
    class: Drupal\monitoring_drupal\Profiler\DataCollector\TimeDataCollector
    arguments: ['@monitoring_drupal.stopwatch']
    tags:
      - { name: data_collector, id: time }
  
  monitoring_drupal.data_collector.cache:
    class: Drupal\monitoring_drupal\Profiler\DataCollector\CacheDataCollector
    arguments: []
    tags:
      - { name: data_collector, id: cache }
